<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== HEADER: GREETING ===== -->
    <header class="greeting-section">
      <!-- Tombol dark/light mode di pojok kanan atas -->
      <button id="theme-toggle" class="btn-icon" title="Toggle Dark/Light Mode">🌙</button>

      <!-- Form ganti nama user -->
      <div class="greeting-name-wrap">
        <span id="greeting-text">Selamat Datang,</span>
        <span id="user-name" class="user-name">Sobat</span>
        <button id="edit-name-btn" class="btn-icon" title="Ganti Nama">✏️</button>
      </div>
      <input
        type="text"
        id="name-input"
        class="name-input hidden"
        placeholder="Masukkan namamu..."
        maxlength="30"
      />

      <!-- Jam dan tanggal -->
      <div class="clock-wrap">
        <div id="clock" class="clock">00:00:00</div>
        <div id="date-display" class="date-display">Senin, 1 Januari 2024</div>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard-grid">

      <!-- ===== KARTU 1: TO-DO LIST ===== -->
      <section class="card todo-card">
        <h2 class="card-title">📝 To-Do List</h2>

        <!-- Form tambah tugas -->
        <div class="todo-form">
          <input
            type="text"
            id="todo-input"
            class="input-field"
            placeholder="Tambah tugas baru..."
            maxlength="100"
          />
          <button id="todo-add-btn" class="btn btn-primary">Tambah</button>
        </div>
        <p id="todo-duplicate-msg" class="error-msg hidden">⚠️ Tugas sudah ada!</p>

        <!-- Daftar tugas -->
        <ul id="todo-list" class="todo-list"></ul>

        <!-- Info jumlah tugas -->
        <div id="todo-summary" class="todo-summary">0 tugas tersisa</div>
      </section>

      <!-- ===== KARTU 2: FOCUS TIMER ===== -->
      <section class="card timer-card">
        <h2 class="card-title">⏱️ Focus Timer</h2>

        <!-- Display timer -->
        <div id="timer-display" class="timer-display">25:00</div>
        <div id="timer-status" class="timer-status">Siap fokus? 🎯</div>

        <!-- Tombol kontrol -->
        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">▶ Start</button>
          <button id="timer-stop" class="btn btn-secondary">⏸ Stop</button>
          <button id="timer-reset" class="btn btn-outline">↺ Reset</button>
        </div>
      </section>

      <!-- ===== KARTU 3: QUICK LINKS ===== -->
      <section class="card links-card">
        <h2 class="card-title">🔗 Quick Links</h2>

        <!-- Form tambah link -->
        <div class="links-form">
          <input
            type="text"
            id="link-name-input"
            class="input-field"
            placeholder="Nama website..."
            maxlength="30"
          />
          <input
            type="url"
            id="link-url-input"
            class="input-field"
            placeholder="https://..."
            maxlength="200"
          />
          <button id="link-add-btn" class="btn btn-primary">Tambah</button>
        </div>

        <!-- Daftar link -->
        <div id="links-list" class="links-list"></div>
      </section>

    </main>

    <script src="js/script.js"></script>
  </body>
</html>
